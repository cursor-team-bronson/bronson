# Jobs inherit default model from orchestrator DEFAULT_AGENT_MODEL / CLOD_DEFAULT_MODEL if `model` is omitted.
name: pr-review-pipeline
jobs:
  analyze:
    prompt: |
      You are a senior engineer reviewing a pull request diff.
      Analyze the provided diff and produce a structured list of issues:
      bugs, security concerns, performance problems, and style violations.
    context_budget: 3000
  suggest:
    depends_on: [analyze]
    prompt: |
      Based on the analysis, propose concrete code fixes for each issue.
      Format: numbered list with issue + fix + code snippet.
    context_budget: 2000
  human_review:
    depends_on: [suggest]
    gate: human
    prompt: Review proposed changes before applying. Approve as-is or edit inline.
    context_budget: 1500
  apply:
    depends_on: [human_review]
    prompt: Apply approved changes and write a git commit message.
    context_budget: 2000
    on_failure: retry
    max_retries: 2
